<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RUMVI Admin Login</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f4f8fb;
        }

        .login-box {
            width: 90%;
            max-width: 400px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
            text-align: center;
        }

        .logo {
            font-size: 32px;
            font-weight: bold;
            color: #1677b8;
            margin-bottom: 5px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }

        h2 {
            margin-bottom: 20px;
            color: #222;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #1677b8;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #125f92;
        }

        .back-link {
            display: block;
            margin-top: 20px;
            color: #1677b8;
            text-decoration: none;
            font-size: 14px;
        }

        #error {
            color: red;
            margin-top: 15px;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <div class="logo">RUMVI</div>
        <div class="subtitle">Pathology Lab</div>

        <h2>Admin Login</h2>

        <form id="loginForm">

            <input
                type="email"
                id="username"
                placeholder="Email Address"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
                required
            >

            <button type="submit">Login</button>

            <p id="error"></p>

        </form>

        <a href="../index.html" class="back-link">
            ← Back to Website
        </a>

    </div>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>

        const SUPABASE_URL = "https://swvnsamzoasocqhyrunu.supabase.co";

        const SUPABASE_KEY = "PASTE_YOUR_PUBLISHABLE_KEY_HERE";

        const supabaseClient = window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );

        document
            .getElementById("loginForm")
            .addEventListener("submit", async function(event) {

                event.preventDefault();

                const email =
                    document.getElementById("username").value.trim();

                const password =
                    document.getElementById("password").value;

                const errorMessage =
                    document.getElementById("error");

                errorMessage.textContent = "";

                const { data, error } =
                    await supabaseClient.auth.signInWithPassword({
                        email: email,
                        password: password
                    });

                if (error) {
                    errorMessage.textContent =
                        "Invalid email or password.";
                    return;
                }

                window.location.href = "dashboard.html";
            });

    </script>

</body>
</html>
