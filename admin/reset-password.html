<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | RUMVI Pathology Lab</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f7fb;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h2 {
            color: #1677b8;
            text-align: center;
        }

        input, button {
            box-sizing: border-box;
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            border-radius: 6px;
            font-size: 15px;
        }

        input {
            border: 1px solid #ccc;
        }

        button {
            background: #1677b8;
            color: white;
            border: none;
            cursor: pointer;
        }

        #message {
            margin-top: 15px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Reset Password</h2>

        <form id="resetForm">
            <input
                type="password"
                id="newPassword"
                placeholder="Enter new password"
                required
                minlength="8"
            >

            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm new password"
                required
                minlength="8"
            >

            <button type="submit">Update Password</button>
        </form>

        <p id="message"></p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        const SUPABASE_URL = "https://swvnsamzoasocqhyrunu.supabase.co";
        const SUPABASE_KEY = "sb_publishable_D4vwmhaWFKRTuojpTlGV6Q_h-OAlAiZ";

        const supabaseClient = window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );

        document.getElementById("resetForm").addEventListener("submit", async function(event) {
            event.preventDefault();

            const password = document.getElementById("newPassword").value;
            const confirmPassword = document.getElementById("confirmPassword").value;
            const message = document.getElementById("message");

            if (password !== confirmPassword) {
                message.textContent = "Passwords do not match.";
                return;
            }

            const { error } = await supabaseClient.auth.updateUser({
                password: password
            });

            if (error) {
                message.textContent = error.message;
            } else {
                message.textContent = "Password updated successfully. You can now log in.";
            }
        });
    </script>
</body>
</html>
